# config_test.yml — small, fast configuration for smoke-testing
#
# Overrides only what is needed to keep tests quick.
# Everything else inherits from defaults.yml.

N_NEURON: 200
N_BATCH: 2
K: 50.0

DURATION: 1.0
T_STEADY: 0.5
T_WINDOW: 0.1
DT: 0.01

N_POP: 2
frac: [0.8, 0.2]

TASK: 'odr'
T_STIM_ON:  [0.5, 1.0, 1.5]
T_STIM_OFF: [0.8, 1.3, 1.8]
I0: [0.2, 0.0, 0.0]
SIGMA0: [1.0, 1.0, 1.0]

Jab: [1.0, -1.5, 1.0, -1.0]
GAIN: 0.5

TF_TYPE: 'relu'
SYN_DYN: 1
IF_NMDA: 1

IF_STP: 0
IF_HEBB: 0
IF_ADAPT: 0
IF_FF_DYN: 0
IF_FF_ADAPT: 0
IF_FF_STP: 0
IF_OPTO: 0
IF_BATCH_J: 0
RATE_DYN: 0
RATE_NOISE: 0
LR_TRAIN: 0
TRAIN_EI: 0
TRAINING: 1

VERBOSE: 0
SEED: 0
