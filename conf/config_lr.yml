###############################################
# config_LR.yml — Rank-2 low-rank E/I network
###############################################
VERBOSE: 0
DEVICE: 'cuda:0'
FLOAT_PRECISION: 32

######################################
# Simulation
######################################
N_BATCH: 1
DT: 0.02
DURATION: 10
T_STEADY: 2.0
T_WINDOW: 0.1

##########################################
# Stimulus: two epochs for V0 and V1
##########################################
TASK: 'none'
T_STIM_ON: [2.0, 5.0]
T_STIM_OFF: [4.0, 7.0]
I0: [0.0, 0.0]
PHI0: [0, 0]
PHI1: [0, 0]
SIGMA0: [0.0, 0.0]

##########################################
# Network architecture
##########################################
N_POP: 2
N_NEURON: 4000
K: 250.0
FRAC_K: 0
frac: [0.75, 0.25]

##########################################
# Transfer function
##########################################
TF_TYPE: 'relu'
THRESH: [0.0, 0.0]

##########################################
# Rate dynamics
##########################################
RATE_DYN: 0
TAU: [0.4, 0.2]
RATE_NOISE: 0
VAR_RATE: 0.0

##########################################
# Synaptic dynamics
##########################################
SYN_DYN: 1
TAU_SYN: [0.3, 0.2]

##########################################
# NMDA
##########################################
IF_NMDA: 0

##########################################
# Plasticity
##########################################
IF_STP: 0

##########################################
# Feedforward inputs
##########################################
Ja0: [2.0, 1.0]
M0: 1.0
VAR_FF: [0.1, 0.1]

##########################################
# Synaptic strengths
##########################################
GAIN: 1.0
Jab: [1.0, -1.5, 1, -1]

##########################################
# Connectivity
##########################################
SEED: 1
CON_TYPE: 'sparse'
PROBA_TYPE: ['None', 'None', 'None', 'None']

##########################################
# Trainable low-rank perturbation (E→E)
##########################################
LR_TRAIN: 1
RANK: 2
LR_MN: 1
LR_UeqV: 0
LR_INI: 1.0
LR_NORM: 0
LR_TYPE: 'standard'
TRAIN_SCALE: 'sparse'
LR_READOUT: 0
LR_READOUT_DIM: 1
CLAMP: 0

TRAIN_EI: 0
IS_TRAIN: [0, 0, 0, 0]

##########################################
# No training — just forward pass
##########################################
TRAINING: 0

SAVE_PATH: '/home/leon/models/NeuroFlame/src/train/runs/lr'
